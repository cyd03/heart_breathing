<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Love Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --beat-speed: 1.1s;
      --float-speed: 4s;
      --bg-rotate-speed: 18s;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #ff7af5 0, #261447 30%, #050816 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      position: relative;
      cursor: pointer;
    }

    /* 点击加速模式的变量调整 */
    body.boost {
      --beat-speed: 0.45s;
      --float-speed: 2.2s;
      --bg-rotate-speed: 10s;
    }

    .scene {
      position: relative;
      width: 340px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 2;
    }

    /* 背后旋转光环背景 */
    .halo {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          rgba(255, 255, 255, 0.2),
          rgba(255, 0, 144, 0.7),
          rgba(98, 0, 255, 0.8),
          rgba(0, 255, 240, 0.6),
          rgba(255, 255, 255, 0.2)
        );
      filter: blur(10px);
      opacity: 0.65;
      z-index: 0;
      animation: halo-rotate var(--bg-rotate-speed) linear infinite;
    }

    .halo::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: inherit;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.0));
      filter: blur(4px);
    }

    .heart-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(0 0 25px rgba(255, 0, 120, 0.8))
        drop-shadow(0 0 45px rgba(177, 0, 255, 0.9));
      animation: float var(--float-speed) ease-in-out infinite;
      z-index: 1;
    }

    /* 心形本体 */
    .heart {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle at 30% 30%, #fff5ff 0, #ff2b75 35%, #b100ff 75%, #3b0fff 100%);
      position: relative;
      transform: rotate(-45deg) scale(1);
      transform-origin: center;
      border-radius: 20px;
      animation: beat var(--beat-speed) ease-in-out infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 130px;
      height: 130px;
      background: inherit;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -65px;
      left: 0;
    }

    .heart::after {
      left: 65px;
      top: 0;
    }

    /* 心中央的高光核心 */
    .heart-core {
      position: absolute;
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #ffffff 0, rgba(255, 255, 255, 0) 65%);
      border-radius: 50%;
      z-index: 2;
      animation: corePulse var(--beat-speed) ease-in-out infinite;
      mix-blend-mode: screen;
    }

    /* 心周围的闪烁小光点（围绕心旋转） */
    .orbit-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0, rgba(255, 255, 255, 0) 70%);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.9),
        0 0 25px rgba(255, 0, 170, 0.8);
      opacity: 0.9;
      animation: orbit 6s linear infinite;
    }

    .orbit-dot:nth-child(1) { animation-duration: 7s; animation-delay: 0s; }
    .orbit-dot:nth-child(2) { animation-duration: 5.5s; animation-delay: -1s; }
    .orbit-dot:nth-child(3) { animation-duration: 6.5s; animation-delay: -2s; }

    .orbit-dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent 70%);
      opacity: 0.9;
    }

    /* 文本部分 */
    .text-main {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 22px rgba(255, 0, 160, 0.9),
        0 0 40px rgba(132, 56, 255, 0.8);
      animation: textPulse 2.2s ease-in-out infinite;
    }

    .text-sub {
      font-size: 14px;
      opacity: 0.9;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      color: #f5d0ff;
    }

    /* 点击时的光圈脉冲 */
    .pulse-ring {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      pointer-events: none;
      mix-blend-mode: screen;
      animation: clickPulse 0.9s ease-out forwards;
      z-index: 5;
    }

    /* 背景粒子（持续上升的小光点） */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 0;
      background: radial-gradient(circle, #fff 0, rgba(255, 255, 255, 0) 70%);
      animation: rise linear forwards;
      mix-blend-mode: screen;
    }

    /* 点击爆炸粒子 */
    .burst-dot {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      mix-blend-mode: screen;
      animation: burst 0.9s ease-out forwards;
      z-index: 6;
    }

    /* ===== 动画部分 ===== */

    /* 心跳动画 */
    @keyframes beat {
      0%, 100% {
        transform: rotate(-45deg) scale(1);
        box-shadow:
          0 0 30px rgba(255, 0, 160, 0.8),
          0 0 70px rgba(177, 0, 255, 0.95);
      }
      25% {
        transform: rotate(-45deg) scale(1.22);
        box-shadow:
          0 0 55px rgba(255, 0, 160, 1),
          0 0 110px rgba(177, 0, 255, 1);
      }
      60% {
        transform: rotate(-45deg) scale(1.05);
      }
    }

    /* 中央核心脉动 */
    @keyframes corePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      25% {
        transform: scale(1.5);
        opacity: 1;
      }
      60% {
        transform: scale(0.85);
        opacity: 0.7;
      }
    }

    /* 整体漂浮 */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* 文本轻微呼吸 */
    @keyframes textPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    /* 背景光环旋转 */
    @keyframes halo-rotate {
      0% {
        transform: rotate(0deg) scale(1.02);
      }
      50% {
        transform: rotate(180deg) scale(1.08);
      }
      100% {
        transform: rotate(360deg) scale(1.02);
      }
    }

    /* 背景粒子上升 */
    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-140vh) scale(1.2);
        opacity: 0;
      }
    }

    /* 点击时候的光圈 */
    @keyframes clickPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 1;
      }
      60% {
        transform: translate(-50%, -50%) scale(2.3);
        opacity: 0.7;
      }
      100% {
        transform: translate(-50%, -50%) scale(3.2);
        opacity: 0;
      }
    }

    /* 点击爆炸粒子动画 */
    @keyframes burst {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0.3);
        opacity: 0;
      }
    }

    /* 小光点绕心旋转 */
    @keyframes orbit {
      0% {
        transform: rotate(0deg) translateX(100px) rotate(0deg);
      }
      100% {
        transform: rotate(360deg) translateX(100px) rotate(-360deg);
      }
    }

    /* 小屏适配 */
    @media (max-width: 480px) {
      .scene {
        transform: scale(0.9);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="halo"></div>

    <div class="heart-wrapper">
      <div class="heart"></div>
      <div class="heart-core"></div>

      <!-- 围绕心旋转的三个小光点 -->
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
    </div>

    <!-- 这里的文字可以自定义成你的告白内容 -->
    <div class="text-main">I ❤ U</div>
    <div class="text-sub">FOREVER &amp; EVER</div>
  </div>

  <script>
    // ===== 背景缓慢上升的粒子（持续效果） =====
    function createBackgroundParticle() {
      const particle = document.createElement("div");
      particle.classList.add("particle");

      const size = Math.random() * 6 + 4; // 4 - 10px
      const left = Math.random() * window.innerWidth;
      const duration = Math.random() * 6 + 6; // 6 - 12s
      const delay = Math.random() * 3;        // 0 - 3s

      particle.style.width = size + "px";
      particle.style.height = size + "px";
      particle.style.left = left + "px";
      particle.style.bottom = "-30px";
      particle.style.animationDuration = duration + "s";
      particle.style.animationDelay = delay + "s";
      particle.style.opacity = Math.random() * 0.7 + 0.3;

      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, (duration + delay) * 1000);
    }

    setInterval(createBackgroundParticle, 320);
    for (let i = 0; i < 25; i++) {
      setTimeout(createBackgroundParticle, i * 120);
    }

    // ===== 点击加速心跳 + 爆炸特效 =====
    let boostTimer = null;

    function createClickPulse(x, y) {
      const ring = document.createElement("div");
      ring.classList.add("pulse-ring");
      ring.style.left = x + "px";
      ring.style.top = y + "px";
      document.body.appendChild(ring);

      setTimeout(() => ring.remove(), 900);
    }

    function createBurst(x, y) {
      const count = 16 + Math.floor(Math.random() * 10);
      for (let i = 0; i < count; i++) {
        const dot = document.createElement("div");
        dot.classList.add("burst-dot");

        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
        const distance = 60 + Math.random() * 50;

        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        dot.style.left = x + "px";
        dot.style.top = y + "px";
        dot.style.setProperty("--dx", dx + "px");
        dot.style.setProperty("--dy", dy + "px");

        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 900);
      }
    }

    function boostHeartbeat(x, y) {
      // 加速心跳（通过类控制 CSS 变量）
      document.body.classList.add("boost");

      // 点击视觉特效
      createClickPulse(x, y);
      createBurst(x, y);

      // 一段时间后恢复正常速度
      if (boostTimer) clearTimeout(boostTimer);
      boostTimer = setTimeout(() => {
        document.body.classList.remove("boost");
      }, 1200);
    }

    // 点击页面任意位置触发
    window.addEventListener("click", (e) => {
      boostHeartbeat(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
